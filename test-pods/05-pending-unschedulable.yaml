# ─── Test: Pending / FailedScheduling ────────────────────────────────────────
#
# WHY IT BREAKS: The pod requests 999Gi of memory — more than any real node
#                can provide. The scheduler cannot place it on any node, so
#                it stays Pending forever.
#
# Expected agent tools: describe_pod → get_node_status
#   Events will show: "0/N nodes are available: insufficient memory"
#   get_node_status will show actual node capacities for comparison.
#
# Real-world equivalent: A Deployment with resource requests that are too
#                        large for the cluster, or a nodeSelector/affinity
#                        rule that doesn't match any available node.
#
# Apply:  kubectl apply -f 05-pending-unschedulable.yaml
# Check:  kubectl get pod -n agent-test test-pending-unschedulable
# Clean:  kubectl delete -f 05-pending-unschedulable.yaml
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: test-pending-unschedulable
  namespace: agent-test
  labels:
    test-case: failed-scheduling
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c", "sleep 3600"]
      resources:
        requests:
          memory: "999Gi"   # ← no node in any normal cluster has this
          cpu: "1m"
        limits:
          memory: "999Gi"
          cpu: "100m"
  restartPolicy: Always
